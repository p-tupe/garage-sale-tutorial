<!doctype html>
<html>

  <head>
    <title>Garage Sale</title>
  </head>

  <body>
    <main>
      {% for d in data %}
      <div style="max-width: 300px">
        <h3>{{d.name}}</h3>
        <img onclick="enlarge(this)" src={{d.src}} alt={{d.name}} loading="lazy" />
        <p>{{d.desc}}</p>
      </div>
      {% endfor %}
    </main>

    <style>
    main {
      display: flex;
      flex-wrap: wrap;
      gap: 1em;
      align-items: center;
      justify-content: center;
    }

    img {
      max-width: 100%;
      cursor: pointer;
    }

    div.modal {
      width:100vw;
      height:100vh;
      position:fixed;
      top:0;
      left:0;
      cursor: zoom-out;
      transform: scale(2);
    }
    </style>

    <script>
    function enlarge(e) {
      const div = document.createElement('div');
      div.classList.add("modal");
      div.style.background = "rgba(0,0,0,0.8) url('"+e.attributes["src"].value+".png') no-repeat center";
      div.addEventListener('click', div.remove);
      document.body.append(div);
    }
    </script>

  </body>

</html>
